chain:
  bech32_prefix: thor
  modules:
    - modules
    - messages
    - auth
    - bank
    - consensus
    - gov
    - mint
    - distribution
    - slashing
    - staking
    - upgrade
    - pricefeed

node:
  type: remote
  config:
    rpc:
      client_name: juno
      address: http://localhost:27147
      max_connections: 20
    grpc:
      address: localhost:9090
      insecure: true

parsing:
  workers: 1
  listen_new_blocks: true
  parse_old_blocks: true
  parse_genesis: true
  start_height: 1
  average_block_time: 6s

database:
  name: bdjuno
  host: localhost
  port: 5432
  user: bdjuno
  password: password
  ssl_mode: disable
  schema: public
  max_open_connections: 1
  max_idle_connections: 1
  partition_size: 100000
  partition_batch: 1000

logging:
  level: debug
  format: text

telemetry:
  enabled: false

pricefeed:
  tokens:
    - name: "Thorchain"
      units:
        - denom: "rune"
          exponent: 8
          price_id: "thorchain"
